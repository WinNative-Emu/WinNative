// gradle/collectLogTags.gradle
// Allow overriding the directories to scan with a project property:
//   -PcollectLogTags.srcDirs=src/main/app,src/main/runtime
// If not provided, use the project's conventional dirs but explicitly ignore src/main/java.
def srcDirsProvider = providers.gradleProperty('collectLogTags.srcDirs')
def overwriteProvider = providers.gradleProperty('collectLogTags.overwrite')

def defaultCandidates = [
        'src/main/app',
        'src/main/feature',
        'src/main/sharedmemory',
        'src/main/runtime',
        'src/main/shared'
]

def javaDir = file('src/main/java')
def outputFile = file('build/generated/source/logtags/com/winlator/cmod/runtime/system/GeneratedLogTags.kt')
def manualOutputFile = file('src/main/java/com/winlator/cmod/runtime/system/GeneratedLogTags.kt')

def srcDirs = srcDirsProvider.isPresent() ?
        srcDirsProvider.get().split(',').collect { file(it.trim()) } :
        defaultCandidates.collect { file(it) }

// Remove any non-existent directories and explicitly exclude the java src dir to avoid duplicates
srcDirs = srcDirs.findAll { it.exists() && !(javaDir.exists() && it.canonicalFile == javaDir.canonicalFile) }

tasks.register('collectLogTags') {
    group = 'build'
    description = 'Collects all TAG variables and literal LogManager calls into a generated class.'

    srcDirs.each { dir ->
        inputs.files(fileTree(dir).include('**/*.kt', '**/*.java'))
              .withPropertyName("srcDir_${dir.name}_${dir.path.hashCode()}")
              .withPathSensitivity(PathSensitivity.RELATIVE)
              .optional()
    }

    // Manual file as optional input to detect changes
    if (manualOutputFile.exists()) {
        inputs.file(manualOutputFile).optional().withPropertyName("manualFile")
    }

    // Task ALWAYS produces the build-dir output to satisfy compiler requirements
    outputs.file outputFile

    doLast {
        def overwrite = overwriteProvider.getOrElse("false").toBoolean()

        // Fix: Mirror manual file if it exists and we aren't overwriting
        if (manualOutputFile.exists() && !overwrite) {
            println "collectLogTags: Manual GeneratedLogTags.kt exists. Mirroring to generated path."
            outputFile.parentFile.mkdirs()
            outputFile.text = manualOutputFile.text
            return
        }

        def tags = new TreeSet<String>()
        def kotlinTagDecl = ~/((?:private\s+)?(?:const\s+)?val\s+TAG\s*=\s*")([^"]+)/
        def javaTagDecl   = ~/private\s+static\s+final\s+String\s+TAG\s*=\s*"([^"]+)"\s*;/
        def literalCallSite = ~/LogManager\.(?:log|logI|logW|logE)\(\s*"([^"]+)"/
        // CLEVER REGEX:
        // \b                : Start at a word boundary
        // (?![A-Z0-9_]*PREF_) : Look ahead and fail if the variable name contains "PREF_"
        // [A-Z0-9_]*        : Match optional uppercase/numeric/underscore prefix
        // TAG               : Match the literal word "TAG"
        // \b                : Ensure "TAG" is the end of the word (excludes TAGS, TAG_FILTER)
        def genericTagDecl  = ~/\b(?![A-Z0-9_]*PREF_)([A-Z0-9_]*TAG)\b\s*=\s*"([^"]+)"/

        inputs.files.each { f ->
            if (!f.isFile() || f == manualOutputFile) return

            // Safety: Skip anything physically or logically inside src/main/java junctions
            if (f.path.contains("src/main/java") || f.path.contains("src\\main\\java")) return
            try {
                if (javaDir.exists() && f.canonicalPath.startsWith(javaDir.canonicalPath)) return
            } catch (ignored) {}

            def text = f.text
            if (!text.contains('LogManager.')) return

            // Efficiently collect ALL unique matches in the file
            text.findAll(literalCallSite) { match -> tags.add(match[1]) }
            text.findAll(genericTagDecl) { match -> tags.add(match[2]) }

            // Filename fallback if no tags found but LogManager is used
            if (tags.isEmpty()) {
                tags.add(f.name.replaceFirst(/\.[^.]+$/, ''))
            }
        }

        def generatedContent = """package com.winlator.cmod.runtime.system

/** Auto-generated by the collectLogTags Gradle task. Do not edit by hand. */
object GeneratedLogTags {
    val TAGS: Set<String> = setOf(
${tags.collect { "        \"$it\"" }.join(",\n")}
    )
}
"""

        outputFile.parentFile.mkdirs()
        outputFile.text = generatedContent

        if (overwrite) {
            manualOutputFile.parentFile.mkdirs()
            manualOutputFile.text = generatedContent
            println "collectLogTags: Overwrote manual file at ${manualOutputFile}"
        }

        println "collectLogTags: wrote ${outputFile} with ${tags.size()} tags."
    }
}
